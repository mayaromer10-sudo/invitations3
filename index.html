<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story - Wedding Invitation</title>
    <style>
        /* --- RESET & DESIGN SYSTEM --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-dark: #1f110b;
            --bg-gradient: radial-gradient(circle, #2a160e 0%, #150905 100%);
            --gold-primary: #d4af37;
            --gold-glow: #f3e5ab;
            --text-light: #fffdfa;
            --romantic-pink: #e8b4b8;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Cinzel', 'Georgia', serif;
            background: var(--bg-gradient);
            overflow: hidden;
            color: var(--text-light);
        }

        canvas#particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* --- SCENE MANAGEMENT --- */
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease-in-out;
            z-index: 3;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- SCENE 1: THE ENVELOPE --- */
        #envelopeScene {
            background: radial-gradient(circle, rgba(255,253,250,0.95) 0%, rgba(244,227,215,0.7) 100%);
        }

        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 240px;
            cursor: pointer;
            transition: transform 1s ease;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.35));
        }

        @media(min-width: 850px) {
            .envelope-wrapper { width: 420px; height: 300px; }
        }

        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #fffdfa;
            border-radius: 6px;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #fcf6f0;
            transform-origin: top;
            transition: transform 1s ease 0.2s;
            z-index: 5;
        }
        @media(min-width: 850px) {
            .envelope-flap { border-left-width: 210px; border-right-width: 210px; border-top-width: 160px; }
        }

        .wax-seal {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) scale(1);
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #e6c565 0%, #b89123 100%);
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            transition: transform 0.6s ease, opacity 0.6s ease;
        }
        @media(min-width: 850px) {
            .wax-seal { top: 135px; width: 60px; height: 60px; font-size: 22px; }
        }

        .envelope-wrapper.open .envelope-flap { transform: rotateX(180deg); z-index: 3; }
        .envelope-wrapper.open .wax-seal { transform: translateX(-50%) scale(0); opacity: 0; }
        .envelope-wrapper.open { transform: scale(0.85) translateY(80px); opacity: 0; pointer-events: none; transition: all 1.2s ease 0.2s; }

        .click-hint {
            position: absolute;
            bottom: -50px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #5a4535;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        /* --- SCENE 2: MAIN MOVIE STAGE --- */
        #movieScene {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* --- VINTAGE CAR --- */
        .car-container {
            position: absolute;
            bottom: 12%;
            left: -600px;
            width: 520px;
            height: 180px;
            z-index: 4;
            transition: left 4.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .vintage-car { position: relative; width: 100%; height: 100%; }
        .car-body { position: absolute; bottom: 30px; width: 500px; height: 85px; background: #fcf9f2; border-radius: 80px 40px 25px 35px; box-shadow: inset -10px -10px 25px rgba(0,0,0,0.15), 0 15px 30px rgba(0,0,0,0.5); }
        .car-cabin { position: absolute; bottom: 110px; left: 140px; width: 220px; height: 60px; background: #fcf9f2; border-radius: 120px 90px 10px 0; }
        .car-window { position: absolute; top: 10px; left: 15px; width: 95px; height: 42px; background: #1f110b; border-radius: 90px 10px 5px 5px; }
        .car-window.rear { left: 115px; border-radius: 10px 70px 5px 5px; }
        .wheel { position: absolute; bottom: 8px; width: 62px; height: 62px; background: #1a1a1a; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 5px 10px rgba(0,0,0,0.5); }
        .wheel-hub { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; background: var(--gold-primary); border-radius: 50%; }
        .wheel.front { left: 80px; }
        .wheel.rear { left: 360px; }

        .car-drive-to-center { left: calc(50% - 260px) !important; }
        .car-drive-away { left: 130% !important; transition: left 3.5s cubic-bezier(0.4, 0, 1, 1) !important; }

        /* --- SPLIT LAYOUT (DESKTOP) --- */
        .split-layout {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: space-between;
        }

        .couple-zone {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .couple-box {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translate(-50%, 40px) scale(0.2);
            opacity: 0;
            z-index: 5;
            transition: all 2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .couple-box.step-out {
            opacity: 1;
            transform: translate(-50%, 0) scale(1.1);
        }

        .couple-box.move-aside {
            left: 25%;
            transform: translate(-50%, 0) scale(1);
            animation: gentleFloat 4s infinite ease-in-out;
        }

        .couple-box.move-aside::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .couple-img {
            width: 280px;
            height: auto;
            display: block;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }

        .speech-bubble {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(10, 5, 3, 0.9);
            border: 2px solid var(--gold-primary);
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(212,175,55,0.4);
            color: var(--gold-glow);
            font-size: 22px;
            letter-spacing: 3px;
            white-space: nowrap;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .speech-bubble.show { transform: translateX(-50%) scale(1); }

        /* --- INFO CONTAINER --- */
        .info-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateX(40px);
            transition: all 2s ease;
            text-align: center;
            padding-right: 4vw;
        }
        
        .info-card-frame {
            border: 3px double var(--gold-primary);
            border-radius: 15px;
            padding: 35px 25px;
            background: rgba(10, 5, 3, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 15px rgba(212,175,55,0.15);
            position: relative;
            max-width: 500px;
        }

        .info-card-frame::before, .info-card-frame::after {
            content: "✨";
            position: absolute;
            color: var(--gold-primary);
            font-size: 18px;
        }
        .info-card-frame::before { top: 10px; left: 10px; }
        .info-card-frame::after { bottom: 10px; right: 10px; }

        .info-zone.visible { opacity: 1; transform: translateX(0); }
        .names { font-size: 40px; font-family: 'Playfair Display', serif; color: #ffffff; margin-bottom: 15px; text-shadow: 0 3px 8px rgba(0,0,0,0.8); }
        .message { font-size: 15px; font-style: italic; color: #f4e3d7; margin-bottom: 25px; line-height: 1.5; }
        .details { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-glow); line-height: 1.8; border-top: 1px dashed rgba(212,175,55,0.4); border-bottom: 1px dashed rgba(212,175,55,0.4); padding: 12px 0; margin-bottom: 25px; }

        /* --- COUNTDOWN --- */
        .countdown-container { display: flex; gap: 12px; justify-content: center; }
        .countdown-item { min-width: 75px; padding: 12px 8px; background: #0a0503; border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        .countdown-value { font-size: 24px; color: #fff; display: block; font-weight: bold; }
        .countdown-label { font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--romantic-pink); margin-top: 2px; display: block; }

        @keyframes pulseGlow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes gentleFloat { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -12px); } }

        /* ======================================================
           🔥 التعديل السحري والنهائي لحل مشكلة الموبايل تمااااماً 🔥
           ====================================================== */
        @media(max-width: 850px) {
            body, html { overflow: hidden !important; position: relative; }
            
            .split-layout { 
                flex-direction: column; 
                justify-content: flex-start; 
                align-items: center;
                height: 100%;
                width: 100%;
                padding: 0;
            }

            /* تثبيت زون الكوبل في الـ 35% العلوية من الشاشة لمنع الارتفاع العشوائي */
            .couple-zone { 
                height: 50%; 
                width: 100%;
                flex: none; 
                display: flex;
                align-items: flex-end; 
                justify-content: center;
                position: relative;
                margin-bottom: 10px;
            }

            /* الكوبل هنا هيفضل ثابت في مكانه الصح بدون ما يطير فوق الشاشة */
            .couple-box {
                bottom: 5px !important;
                top: auto !important;
            }

            .couple-box.step-out {
                transform: translate(-50%, 0) scale(0.68) !important;
                transform-origin: bottom center;
            }

            /* عند الانتقال للجنب (الأنيميشن التاني)، هيفضل في النص برضه لكن بحجم متناسق للموبايل */
            .couple-box.move-aside {
                left: 50% !important; 
                bottom: 5px !important;
                transform: translate(-50%, 0) scale(0.68) !important;
                transform-origin: bottom center;
                animation: gentleFloatMobile 4s infinite ease-in-out;
            }
            
            .couple-box.move-aside::before { width: 180px; height: 180px; }
            .couple-img { width: 250px; height: auto; }

            /* ظهور كلمة YOU ARE INVITED بوضوح فوق راس الكوبل تماماً ومفيش حاجة تقطعها */
            .speech-bubble {
                top: -55px !important;
                font-size: 15px !important;
                padding: 6px 16px !important;
                letter-spacing: 2px;
            }
            
            @keyframes gentleFloatMobile { 0%, 100% { transform: translate(-50%, 0) scale(0.68); } 50% { transform: translate(-50%, -6px) scale(0.68); } }

            /* زون البيانات هتبدأ علطول تحت الكوبل وبانسيابية */
            .info-zone { 
                flex: 1;
                width: 100%;
                padding-right: 0; 
                justify-content: flex-start;
                transform: translateY(20px);
                z-index: 6;
            }
            .info-zone.visible { transform: translateY(0); }

            /* تفاصيل الكارت الذهبي السواد بتاعه داكن ومريح ومبيعملش سكرول */
            .info-card-frame {
                padding: 16px 14px;
                width: 88%;
                max-height: 56vh;
                background: rgba(8, 4, 2, 0.94) !important; 
                box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            }
            
            .names { font-size: 24px; margin-bottom: 4px; }
            .message { font-size: 11px; margin-bottom: 8px; line-height: 1.4; }
            .details { font-size: 10px; padding: 6px 0; margin-bottom: 10px; }
            
            /* مربعات العداد التنازلي سوداء بالكامل وجميلة جداً ومظبوطة */
            .countdown-container { gap: 6px; }
            .countdown-item { min-width: 52px; padding: 6px 2px; border-radius: 6px; background: #000000 !important; border: 1px solid rgba(212, 175, 55, 0.5); }
            .countdown-value { font-size: 16px; }
            .countdown-label { font-size: 7px; }
            
            /* تصغير وضبط مسار السيارة الكلاسيكية في الموبايل عشان تظهر كاملة فوق الكارت وتحت الكوبل */
            .car-container { width: 260px; height: 100px; bottom: 42%; left: -300px; }
            .car-body { width: 240px; height: 42px; bottom: 10px; }
            .car-cabin { width: 110px; height: 26px; left: 65px; bottom: 50px; }
            .car-window { width: 45px; height: 18px; top: 5px; }
            .car-window.rear { left: 55px; }
            .wheel { width: 30px; height: 30px; bottom: 0px; }
            .wheel.front { left: 40px; }
            .wheel.rear { left: 170px; }
            .car-drive-to-center { left: calc(50% - 130px) !important; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="scene active" id="envelopeScene">
        <div class="envelope-wrapper" id="envelopeInteractive" onclick="openInvitation()">
            <div class="envelope-flap"></div>
            <div class="envelope"></div>
            <div class="wax-seal">🤍</div>
            <div class="click-hint">Click to Open</div>
        </div>
    </div>

    <div class="scene" id="movieScene">
        <div class="split-layout">
            
            <div class="couple-zone">
                <div class="couple-box" id="weddingCouple">
                    <div class="speech-bubble" id="speechBubble">YOU ARE INVITED</div>
                    <img src="./download (3).png" alt="Wedding Couple" class="couple-img">
                </div>
            </div>

            <div class="info-zone" id="infoZone">
                <div class="info-card-frame">
                    <div class="names">Sondos &amp; Ziad</div>
                    <div class="message">"Join us to celebrate our love story as we step into our beautiful forever together."</div>
                    
                    <div class="details">
                        Saturday, October 17, 2026<br>
                        The Grand Rosewood Estate, Riviera
                    </div>
                    
                    <div class="countdown-container">
                        <div class="countdown-item"><span class="countdown-value" id="days">00</span><span class="countdown-label">Days</span></div>
                        <div class="countdown-item"><span class="countdown-value" id="hours">00</span><span class="countdown-label">Hrs</span></div>
                        <div class="countdown-item"><span class="countdown-value" id="minutes">00</span><span class="countdown-label">Min</span></div>
                        <div class="countdown-item"><span class="countdown-value" id="seconds">00</span><span class="countdown-label">Sec</span></div>
                    </div>
                </div>
            </div>

        </div>

        <div class="car-container" id="vintageCar">
            <div class="vintage-car">
                <div class="car-cabin"><div class="car-window front"></div><div class="car-window rear"></div></div>
                <div class="car-body"></div>
                <div class="wheel front"><div class="wheel-hub"></div></div>
                <div class="wheel rear"><div class="wheel-hub"></div></div>
            </div>
        </div>

    </div>

    <script>
        /* --- ENGINE: FLOATING ROSE PETALS & GEMS --- */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor(type) { this.type = type; this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height - 20;
                this.size = this.type === 'petal' ? Math.random() * 6 + 6 : Math.random() * 4 + 2;
                this.speedY = this.type === 'petal' ? Math.random() * 1.0 + 0.6 : Math.random() * 1.5 + 0.8;
                this.speedX = Math.random() * 1.0 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.color = this.type === 'petal' ? `rgba(232, 180, 184, ${this.opacity})` : `rgba(212, 175, 55, ${this.opacity})`;
            }
            update() { this.y += this.speedY; this.x += this.speedX; this.rotation += this.rotationSpeed; if (this.y > canvas.height) this.reset(); }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                if (this.type === 'petal') {
                    ctx.rotate((this.rotation * Math.PI) / 180); ctx.fillStyle = this.color; ctx.beginPath();
                    ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.fillStyle = this.color; ctx.shadowBlur = 10; ctx.shadowColor = "rgba(212, 175, 55, 0.8)";
                    ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
        }
        for(let i=0; i<25; i++) particles.push(new Particle('petal'));
        for(let i=0; i<25; i++) particles.push(new Particle('gold'));
        function runCanvas() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(runCanvas); }
        runCanvas();

        /* --- TIMELINE CONTROLLER --- */
        function openInvitation() {
            const envelope = document.getElementById('envelopeInteractive');
            const envelopeScene = document.getElementById('envelopeScene');
            const movieScene = document.getElementById('movieScene');
            const car = document.getElementById('vintageCar');
            const couple = document.getElementById('weddingCouple');
            const bubble = document.getElementById('speechBubble');
            const infoZone = document.getElementById('infoZone');

            envelope.classList.add('open');

            setTimeout(() => {
                envelopeScene.classList.remove('active');
                movieScene.classList.add('active');
                
                // الأوقات المتناسقة لظهور الأنيميشن ورا بعضه بالملي
                setTimeout(() => { car.classList.add('car-drive-to-center'); }, 300);
                setTimeout(() => { couple.classList.add('step-out'); }, 4800);
                setTimeout(() => { bubble.classList.add('show'); }, 6500);

                setTimeout(() => {
                    bubble.classList.remove('show');
                    car.classList.remove('car-drive-to-center');
                    car.classList.add('car-drive-away'); 
                    couple.classList.add('move-aside'); 
                }, 9500);

                setTimeout(() => { infoZone.classList.add('visible'); }, 11000);

            }, 1300);
        }

        /* --- COUNTDOWN --- */
        const dateTarget = new Date("October 17, 2026 16:00:00").getTime();
        function calcTimer() {
            const now = new Date().getTime();
            const gap = dateTarget - now;
            if(gap <= 0) return;
            const d = Math.floor(gap / (1000 * 60 * 60 * 24));
            const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((gap % (1000 * 60)) / 1000);
            document.getElementById("days").innerText = d < 10 ? '0'+d : d;
            document.getElementById("hours").innerText = h < 10 ? '0'+h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0'+m : m;
            document.getElementById("seconds").innerText = s < 10 ? '0'+s : s;
        }
        setInterval(calcTimer, 1000); calcTimer();
    </script>
</body>
</html>
